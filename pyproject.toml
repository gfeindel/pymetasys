[project]
name = "metasys-web"
version = "0.1.0"
description = "Web front-end for Johnson Controls Metasys CF Terminal via serial-to-IP bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyte>=0.8.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
metasys-web = "metasys.server:main"
metasys-spike = "metasys.spike:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metasys = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
